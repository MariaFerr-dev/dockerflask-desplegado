name: Publicar Imagen en Docker Hub

on:
  push:
    branches: ["main", "feature/vulnerabilidades"]

jobs:
 test-and-security:
  runs-on: ubuntu-latest
  steps:
   - name: Descargar codigo
     uses: actions/checkout@v4
   - name: Configurar python
     uses: actions/setup-python@v4
     with:
      python-version: '3.13'

   - name: Instalar dependencias
     run: |
       python -m pip install --upgrade pip
       python -m pip install -r requirements.txt
       pip install bandit
   - name: Escaneo de seguridad con Bandit
     run: bandit -r . -s B101 #IGNORAR LOS ARCHIVOS TEST
   - name: Ejecutar pruebas
     run: pytest 
       
 build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir imagen
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/proyecto-compose-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/proyecto-compose-backend:${{ github.sha }}

      - name: escanear contenedor con trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/proyecto-compose-backend:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'


      - name: Subir la imagen a Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/proyecto-compose-backend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/proyecto-compose-backend:${{ github.sha }}

      - name: Desplegar en el servidor cloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          use_insecure_cipher: true
          script: |
            set -e
            cd ~/dockerflask-desplegado
            git fetch origin main
            git checkout origin/main -- backend docker-compose.yml frontend nginx
            docker compose down || true
            docker compose up -d --force-recreate db
            for attempt in $(seq 1 60); do
              if docker compose exec -T db sh -c 'mysqladmin ping -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD" --silent' >/dev/null 2>&1; then
                break
              fi
              container_status=$(docker inspect --format '{{.State.Status}}' proyecto-db 2>/dev/null || true)
              if [ "$attempt" -eq 60 ] || [ "$container_status" = "exited" ]; then
                docker compose logs db
                docker inspect proyecto-db --format 'status={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}}'
                exit 1
              fi
              echo "Waiting for MySQL (${attempt}/60)..."
              sleep 2
            done
            docker compose up -d --build --force-recreate --no-deps backend frontend
            if docker compose config --services | grep -qx nginx; then
              docker compose up -d --build --force-recreate nginx
            fi
