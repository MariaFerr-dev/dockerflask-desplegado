name: Publicar Imagen en Docker Hub

on:
  push:
    branches: ["main"]

jobs:
 test:
  runs-on: ubuntu-lates
  steps:
   - name: Descargar codigo
     uses: actions/checkout@v4
   - name: Configurar python
     uses: actions/setup-python@v4
     with:
      python-version: '3.13'

   - name: Instalar dependencias
     run: |
       python -m pip install --upgrade pip
       python -m pip install -r requirements.txt
   - name: Ejecutar pruebas
     run: pytest 
       
 build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y subir backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/proyecto-compose-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/proyecto-compose-backend:${{ github.sha }}

      - name: Construir y subir frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/proyecto-compose-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/proyecto-compose-frontend:${{ github.sha }}
      - name: Desplegar en el servidor cloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          use_insecure_cipher: true
          script: |
            cd ~/dockerflask-desplegado
            docker compose pull backend
            docker compose up -d
